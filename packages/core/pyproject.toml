[project]
name = "clonebins-core"
version = "0.1.1"
description = "Shared clustering pipeline for CloneBins (embed, cluster, export)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CloneBins contributors" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8,<5",
  "pillow>=10.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Optional InsightFace swap-in (not required for the default YuNet + SFace path).
insightface = ["insightface>=0.7", "onnxruntime>=1.16"]
# Optional heavier appearance / ReID embedding later.
clip = ["open-clip-torch>=2.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
