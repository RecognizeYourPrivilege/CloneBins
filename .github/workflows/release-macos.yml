# Builds CloneBins.app on GitHub-hosted macOS and publishes both DMGs
# on a GitHub Release. Linux cannot produce a .app.
#
#   dmg-arm64  → macos-latest  (Apple Silicon)
#   dmg-x64    → macos-15-intel (native Intel; do not Rosetta-cross on arm64)
#
# v0.1.1 failed because the Intel job ran on macos-latest (arm64) under
# `arch -x86_64`. setup-python's x64 interpreter is the python.org Framework
# build, whose site-packages already had arm64 cryptography (pulled in by
# paramiko/smbprotocol). PyInstaller then raised IncompatibleBinaryArchError.
# Tag v0.1.1 was also cancelled: concurrency grouped every macOS release
# together with cancel-in-progress, so the later main push aborted the tag.
#
# Rebuilds replace CloneBins-<ver>-macos-arm64.dmg and macos-x64.dmg only.
# Apps are ad-hoc signed (`codesign --sign -`), not Developer ID / notarized.
# Optional Apple secrets (not required for these unsigned DMGs):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_TEAM_ID, APPLE_ID, APPLE_APP_PASSWORD,
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER
# See apps/desktop/README.md.
name: Release macOS DMG

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      # Feature-branch rebuilds (same pattern as linux-release).
      - cursor/macos-dmg-v011-fd07
      - cursor/macos-models-verify-cb91
      - cursor/macos-models-download-e2c0
      - cursor/bake-models-v014-1384
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or reuse (e.g. v0.1.4)"
        required: true
        default: "v0.1.4"

permissions:
  contents: write

# Per-ref so a push to main cannot cancel a tag or feature-branch build
# (shared-group + cancel-in-progress dropped v0.1.1). Same-ref rebuilds
# must cancel the previous run: otherwise a failed arm64 + in-progress x64
# holds the slot and a later good commit stays pending forever.
concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.4') }}

jobs:
  macos-dmg:
    name: dmg-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            python_arch: arm64
            pyinstaller_arch: arm64
          - arch: x64
            # Native Intel. macos-13 is retired; macos-15-intel is the
            # standard-hosted replacement (available through Aug 2027).
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            python_arch: x64
            pyinstaller_arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk on Intel (avoid ENOSPC hang)
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          df -h
          # Simulator runtimes are the usual multi-GB hog on macos-15-intel.
          sudo rm -rf /Library/Developer/CoreSimulator/Caches || true
          rm -rf "$HOME/Library/Developer/CoreSimulator" "$HOME/Library/Developer/Xcode/DerivedData" || true
          rm -rf "$HOME/Library/Caches/Homebrew" || true
          df -h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.runner }}-${{ matrix.arch }}

      - name: Isolated venv + verify native extension arch
        run: |
          set -euo pipefail
          HOST_PY="${pythonLocation}/bin/python3"
          test -x "$HOST_PY"
          echo "host python: $HOST_PY"
          file "$HOST_PY"
          "$HOST_PY" -c "import platform, sys; print(sys.executable, sys.prefix, platform.machine(), sys.version)"

          EXPECT="${{ matrix.pyinstaller_arch }}"
          MACHINE="$("$HOST_PY" -c 'import platform; print(platform.machine())')"
          if [[ "$MACHINE" != "$EXPECT" && "$MACHINE" != "i386" ]]; then
            echo "Runner Python is $MACHINE, expected $EXPECT on ${{ matrix.runner }}" >&2
            uname -m >&2
            exit 1
          fi

          VENV="${RUNNER_TEMP}/cb-venv"
          "$HOST_PY" -m venv "$VENV"
          PY="$VENV/bin/python"
          "$PY" -m pip install --upgrade pip
          # Fresh venv so we never reuse the runner image's Framework
          # site-packages (that is what leaked arm64 cryptography on v0.1.1).
          "$PY" -m pip install --no-cache-dir -e packages/core -e packages/api pyinstaller
          "$PY" -m pip install --no-cache-dir --force-reinstall cryptography

          "$PY" -c '
          import subprocess, sys
          expect = "'"$EXPECT"'"
          import cryptography.hazmat.bindings._rust as rust
          path = rust.__file__
          info = subprocess.check_output(["file", path], text=True)
          print(path)
          print(info.strip())
          ok = expect in info or "universal" in info.lower()
          if not ok:
              raise SystemExit(f"cryptography extension is not {expect}: {info}")
          '

          {
            echo "CLONEBINS_PY=$PY"
            echo "CLONEBINS_VERSION=${RELEASE_TAG#v}"
          } >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Bake ONNX weights into app resources
        run: |
          set -euo pipefail
          chmod +x apps/desktop/scripts/fetch-bundled-models.sh
          PYTHON="$CLONEBINS_PY" apps/desktop/scripts/fetch-bundled-models.sh
          find apps/desktop/resources/models -name '*.onnx' | wc -l
          test -f apps/desktop/resources/models/face_recognition_sface_2021dec.onnx
          df -h

      - name: Freeze clonebins-api sidecar
        run: |
          set -euo pipefail
          chmod +x apps/desktop/scripts/freeze-python-bin.sh
          TARGET_ARCH="${{ matrix.pyinstaller_arch }}" \
            apps/desktop/scripts/freeze-python-bin.sh api "$CLONEBINS_PY"
          file dist/clonebins-api
          ls -lh dist/clonebins-api
          df -h .

      - name: Install JS deps
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Build CloneBins.app (${{ matrix.arch }})
        working-directory: apps/desktop
        # Bundle the .app only. `--bundles dmg` deletes macos/CloneBins.app after
        # wrapping, which leaves nothing to inject the sidecar into.
        run: npx tauri build --target ${{ matrix.rust_target }} --bundles app

      - name: Inject sidecar and wrap unsigned DMG
        run: |
          set -euo pipefail
          chmod +x apps/desktop/scripts/package-macos-dmg.sh
          VERSION="${RELEASE_TAG#v}"
          APP="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/CloneBins.app"
          if [[ ! -d "$APP" ]]; then
            APP="$(find apps/desktop/src-tauri/target -type d -name 'CloneBins.app' | head -n 1)"
          fi
          if [[ ! -d "$APP" ]]; then
            echo "CloneBins.app not found. Bundle tree:" >&2
            find apps/desktop/src-tauri/target -maxdepth 6 -type d -print >&2 || true
            exit 1
          fi
          # Drop compile leftovers so hdiutil scratch is not fighting cargo.
          TARGET_REL="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release"
          rm -rf "$TARGET_REL/deps" "$TARGET_REL/incremental" "$TARGET_REL/build" \
            "$TARGET_REL/.fingerprint" "${RUNNER_TEMP}/cb-venv" || true
          mkdir -p dist/release
          df -h .
          du -sh "$APP" dist/clonebins-api || true
          apps/desktop/scripts/package-macos-dmg.sh \
            dist/clonebins-api \
            "$APP" \
            "dist/release/CloneBins-${VERSION}-macos-${{ matrix.arch }}.dmg"
          ls -lh dist/release
          file dist/release/*

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/release/CloneBins-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: macos-dmg
    # Do not publish a partial v0.1.4 if one arch failed. `!cancelled()`
    # used to force this job even when the matrix had a failure.
    if: ${{ !cancelled() && needs.macos-dmg.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dmg-arm64
          path: dist/release

      - uses: actions/download-artifact@v4
        with:
          name: dmg-x64
          path: dist/release

      - name: Require both macOS DMGs before publish
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          test -f "dist/release/CloneBins-${VERSION}-macos-arm64.dmg"
          test -f "dist/release/CloneBins-${VERSION}-macos-x64.dmg"
          ls -lh dist/release

      - name: Delete previous macOS DMGs on the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          VERSION="${TAG#v}"
          gh release view "$TAG" --json assets --jq '.assets[].name' || true
          gh release delete-asset "$TAG" "CloneBins-${VERSION}-macos-arm64.dmg" --yes || true
          gh release delete-asset "$TAG" "CloneBins-${VERSION}-macos-x64.dmg" --yes || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CloneBins ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/release/*
          body_path: .github/release-notes-v0.1.4.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
