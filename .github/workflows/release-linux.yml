# Builds Linux installers (Ubuntu .deb + AppImage, Arch pkg.tar.zst, Alpine apk)
# and attaches them to a GitHub Release without replacing macOS DMGs.
name: Release Linux

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - cursor/linux-release-36e4
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or reuse (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-linux
  cancel-in-progress: true

env:
  CLONEBINS_VERSION: "0.1.0"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0') }}

jobs:
  ubuntu:
    name: ubuntu-deb
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ubuntu-22.04

      - name: Install GTK / WebKit / dpkg
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libssl-dev \
            libayatana-appindicator3-dev file dpkg-dev zstd libarchive-tools \
            libfuse2 wget

      - name: Freeze clonebins-api sidecar
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core -e packages/api pyinstaller
          chmod +x apps/desktop/scripts/freeze-python-bin.sh
          apps/desktop/scripts/freeze-python-bin.sh api python
          mkdir -p apps/desktop/src-tauri/sidecars
          cp dist/clonebins-api apps/desktop/src-tauri/sidecars/clonebins-api
          chmod +x apps/desktop/src-tauri/sidecars/clonebins-api

      - name: Install JS deps
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Build Tauri deb + AppImage
        working-directory: apps/desktop
        run: |
          npx tauri build --bundles deb,appimage --config src-tauri/linux-sidecar.tauri.conf.json

      - name: Collect Ubuntu artifacts
        run: |
          set -euo pipefail
          mkdir -p dist/release
          chmod +x apps/desktop/scripts/package-linux.sh
          DEB="$(find apps/desktop/src-tauri/target -type f -name '*.deb' | head -n 1 || true)"
          APPIMAGE="$(find apps/desktop/src-tauri/target -type f -name '*.AppImage' | head -n 1 || true)"
          DESKTOP_BIN="apps/desktop/src-tauri/target/release/clonebins-desktop"
          if [[ -n "${DEB:-}" ]]; then
            if dpkg-deb -c "$DEB" | grep -q 'usr/bin/clonebins-api'; then
              cp "$DEB" dist/release/CloneBins-0.1.0-ubuntu-amd64.deb
            else
              apps/desktop/scripts/package-linux.sh inject-deb \
                --deb "$DEB" \
                --api dist/clonebins-api \
                --out dist/release/CloneBins-0.1.0-ubuntu-amd64.deb
            fi
          else
            echo "Tauri did not write a .deb; packaging from the raw binary" >&2
            test -x "$DESKTOP_BIN"
            apps/desktop/scripts/package-linux.sh deb \
              --desktop "$DESKTOP_BIN" \
              --api dist/clonebins-api \
              --out dist/release/CloneBins-0.1.0-ubuntu-amd64.deb
          fi
          if [[ -n "${APPIMAGE:-}" ]]; then
            OUT_APP=dist/release/CloneBins-0.1.0-linux-x64.AppImage
            if grep -a -q clonebins-api "$APPIMAGE"; then
              cp "$APPIMAGE" "$OUT_APP"
            else
              echo "AppImage missing sidecar; attempting inject" >&2
              TOOL="$(find "$HOME" apps/desktop/src-tauri -name 'appimagetool*' -type f 2>/dev/null | head -n 1 || true)"
              if [[ -z "$TOOL" ]]; then
                wget -q -O /tmp/appimagetool.AppImage \
                  https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                chmod +x /tmp/appimagetool.AppImage
                TOOL=/tmp/appimagetool.AppImage
              fi
              APPIMAGETOOL="$TOOL" apps/desktop/scripts/package-linux.sh inject-appimage \
                --appimage "$APPIMAGE" \
                --api dist/clonebins-api \
                --out "$OUT_APP" || cp "$APPIMAGE" "$OUT_APP"
            fi
            chmod +x "$OUT_APP"
          fi
          ls -lh dist/release
          dpkg-deb -c dist/release/CloneBins-0.1.0-ubuntu-amd64.deb | grep usr/bin

      - uses: actions/upload-artifact@v4
        with:
          name: linux-ubuntu
          path: dist/release/*
          if-no-files-found: error

  arch:
    name: arch-pkg
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: archlinux:latest
    steps:
      - name: Install build deps
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git curl wget base-devel \
            webkit2gtk-4.1 gtk3 librsvg libappindicator-gtk3 \
            openssl patchelf pkgconf clang \
            nodejs npm rust \
            python python-pip python-setuptools python-virtualenv \
            zstd libarchive file

      - uses: actions/checkout@v4

      - name: Freeze clonebins-api sidecar
        run: |
          python -m venv /tmp/cbvenv || virtualenv /tmp/cbvenv
          /tmp/cbvenv/bin/pip install --upgrade pip
          /tmp/cbvenv/bin/pip install -e packages/core -e packages/api pyinstaller
          chmod +x apps/desktop/scripts/freeze-python-bin.sh
          apps/desktop/scripts/freeze-python-bin.sh api /tmp/cbvenv/bin/python

      - name: Install JS deps
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Build Tauri binary (no bundle)
        working-directory: apps/desktop
        run: npx tauri build --no-bundle

      - name: Wrap Arch package
        run: |
          set -euo pipefail
          mkdir -p dist/release
          chmod +x apps/desktop/scripts/package-linux.sh
          DESKTOP_BIN="apps/desktop/src-tauri/target/release/clonebins-desktop"
          test -x "$DESKTOP_BIN"
          apps/desktop/scripts/package-linux.sh arch \
            --desktop "$DESKTOP_BIN" \
            --api dist/clonebins-api \
            --out dist/release/CloneBins-0.1.0-archlinux-x86_64.pkg.tar.zst
          tar -tf dist/release/CloneBins-0.1.0-archlinux-x86_64.pkg.tar.zst | grep usr/bin
          ls -lh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-arch
          path: dist/release/*
          if-no-files-found: error

  alpine:
    name: alpine-apk
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: alpine:latest
    steps:
      - name: Install build deps
        shell: sh
        run: |
          apk add --no-cache \
            bash git curl wget tar gzip ca-certificates \
            build-base pkgconf clang \
            gtk+3.0-dev librsvg-dev openssl-dev patchelf \
            nodejs npm \
            python3 py3-pip py3-virtualenv python3-dev \
            linux-headers libffi-dev \
            file
          apk add --no-cache webkit2gtk-4.1-dev || apk add --no-cache webkit2gtk-dev || true
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --default-host x86_64-unknown-linux-musl
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Python venv + freeze CLI and API
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/cbvenv || virtualenv /tmp/cbvenv
          /tmp/cbvenv/bin/pip install --upgrade pip wheel
          /tmp/cbvenv/bin/pip install --prefer-binary -e packages/core -e packages/cli -e packages/api pyinstaller
          chmod +x apps/desktop/scripts/freeze-python-bin.sh
          apps/desktop/scripts/freeze-python-bin.sh api /tmp/cbvenv/bin/python
          apps/desktop/scripts/freeze-python-bin.sh cli /tmp/cbvenv/bin/python

      - name: Install JS deps
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Try Tauri GUI on musl
        id: tauri
        shell: bash
        continue-on-error: true
        working-directory: apps/desktop
        env:
          RUSTFLAGS: "-C target-feature=-crt-static"
          OPENSSL_NO_VENDOR: "1"
        run: |
          source "$HOME/.cargo/env"
          rustc --version
          npx tauri build --no-bundle

      - name: Wrap Alpine apk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          chmod +x apps/desktop/scripts/package-linux.sh
          ARGS=(alpine --api dist/clonebins-api --cli dist/clonebins --out dist/release/CloneBins-0.1.0-alpine-x86_64.apk)
          DESKTOP_BIN="apps/desktop/src-tauri/target/release/clonebins-desktop"
          if [[ -x "$DESKTOP_BIN" ]]; then
            echo "Including musl Tauri GUI in Alpine apk"
            ARGS+=(--desktop "$DESKTOP_BIN")
          else
            echo "Tauri GUI not built on musl; Alpine apk is CLI + clonebins-api"
          fi
          apps/desktop/scripts/package-linux.sh "${ARGS[@]}"
          tar -tzf dist/release/CloneBins-0.1.0-alpine-x86_64.apk | grep usr/bin
          ls -lh dist/release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-alpine
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: [ubuntu, arch, alpine]
    if: ${{ !cancelled() && (needs.ubuntu.result == 'success' || needs.arch.result == 'success' || needs.alpine.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/release

      - name: List artifacts
        run: ls -lh dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CloneBins ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/release/*
          body: |
            Desktop installers for macOS and Linux. Clustering stays on your machine;
            there is no cloud account. Each GUI package includes a bundled
            `clonebins-api` sidecar (same `clonebins_core` pipeline as the CLI).

            ### macOS
            | File | Mac |
            | --- | --- |
            | `CloneBins-0.1.0-macos-arm64.dmg` | Apple Silicon (M1/M2/M3/M4) |
            | `CloneBins-0.1.0-macos-x64.dmg` | Intel |

            **Not notarized.** First launch: right-click the app → Open, or allow it under
            System Settings → Privacy & Security. Ad-hoc signed on GitHub Actions.

            ### Linux
            | File | Distro |
            | --- | --- |
            | `CloneBins-0.1.0-ubuntu-amd64.deb` | Ubuntu / Debian (glibc, WebKitGTK 4.1) |
            | `CloneBins-0.1.0-linux-x64.AppImage` | Generic glibc Linux (chmod +x, then run) |
            | `CloneBins-0.1.0-archlinux-x86_64.pkg.tar.zst` | Arch Linux |
            | `CloneBins-0.1.0-alpine-x86_64.apk` | Alpine (musl). GUI if WebKit built; otherwise CLI + `clonebins-api` |

            Ubuntu:
            ```
            sudo apt install ./CloneBins-0.1.0-ubuntu-amd64.deb
            ```

            Arch:
            ```
            sudo pacman -U CloneBins-0.1.0-archlinux-x86_64.pkg.tar.zst
            ```

            Alpine (unsigned CI package):
            ```
            sudo apk add --allow-untrusted CloneBins-0.1.0-alpine-x86_64.apk
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
