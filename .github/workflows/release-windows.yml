# Builds a Windows NSIS installer + portable zip (CloneBins.exe + clonebins-api.exe)
# and attaches them to a GitHub Release without replacing macOS/Linux assets.
name: Release Windows

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - cursor/linux-release-36e4
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or reuse (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

concurrency:
  group: release-windows
  cancel-in-progress: true

env:
  CLONEBINS_VERSION: "0.1.1"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.1') }}

jobs:
  windows:
    name: windows-nsis
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: windows-x64

      - name: Freeze clonebins-api sidecar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e packages/core -e packages/api pyinstaller
          bash apps/desktop/scripts/freeze-python-bin.sh api python
          test -f dist/clonebins-api.exe
          mkdir -p apps/desktop/src-tauri/sidecars
          cp dist/clonebins-api.exe apps/desktop/src-tauri/sidecars/clonebins-api.exe
          ls -lh dist/clonebins-api.exe apps/desktop/src-tauri/sidecars/clonebins-api.exe

      - name: Install JS deps
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix apps/desktop

      - name: Build Tauri NSIS
        working-directory: apps/desktop
        shell: bash
        run: npx tauri build --bundles nsis --config src-tauri/windows-sidecar.tauri.conf.json

      - name: Collect Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          chmod +x apps/desktop/scripts/package-windows.sh
          DESKTOP=""
          for candidate in \
            apps/desktop/src-tauri/target/release/CloneBins.exe \
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/CloneBins.exe \
            apps/desktop/src-tauri/target/release/clonebins-desktop.exe \
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/clonebins-desktop.exe
          do
            if [[ -f "$candidate" ]]; then
              DESKTOP="$candidate"
              break
            fi
          done
          if [[ -z "${DESKTOP:-}" ]]; then
            DESKTOP="$(find apps/desktop/src-tauri/target -type f \( -iname 'CloneBins.exe' -o -iname 'clonebins-desktop.exe' \) | head -n 1 || true)"
          fi
          if [[ -z "${DESKTOP:-}" ]]; then
            echo "CloneBins.exe not found. Tree:" >&2
            find apps/desktop/src-tauri/target -maxdepth 6 -type f -name '*.exe' -print >&2 || true
            exit 1
          fi
          echo "Using desktop exe: $DESKTOP"
          API=dist/clonebins-api.exe
          test -f "$API"
          EXTRAS=()
          while IFS= read -r dll; do
            EXTRAS+=(--extra "$dll")
          done < <(find "$(dirname "$DESKTOP")" -maxdepth 1 -type f \( -iname 'WebView2Loader.dll' -o -iname '*.dll' \) | head -n 20)
          apps/desktop/scripts/package-windows.sh zip \
            --desktop "$DESKTOP" \
            --api "$API" \
            "${EXTRAS[@]+"${EXTRAS[@]}"}" \
            --out dist/release/CloneBins-0.1.1-windows-x64.zip
          NSIS=""
          for candidate in \
            apps/desktop/src-tauri/target/release/bundle/nsis/CloneBins_0.1.1_x64-setup.exe \
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/CloneBins_0.1.1_x64-setup.exe
          do
            if [[ -f "$candidate" ]]; then
              NSIS="$candidate"
              break
            fi
          done
          if [[ -z "${NSIS:-}" ]]; then
            NSIS="$(find apps/desktop/src-tauri/target -type f -iname '*setup.exe' | head -n 1 || true)"
          fi
          if [[ -z "${NSIS:-}" ]]; then
            NSIS="$(find apps/desktop/src-tauri/target -path '*/bundle/nsis/*' -type f -iname '*.exe' | head -n 1 || true)"
          fi
          if [[ -n "${NSIS:-}" ]]; then
            apps/desktop/scripts/package-windows.sh nsis \
              --installer "$NSIS" \
              --out dist/release/CloneBins-0.1.1-windows-x64-setup.exe
          else
            echo "NSIS installer missing; portable zip still published" >&2
            find apps/desktop/src-tauri/target -maxdepth 6 -type d -print >&2 || true
          fi
          ls -lh dist/release
          python -c 'import zipfile; z=zipfile.ZipFile("dist/release/CloneBins-0.1.1-windows-x64.zip"); names=z.namelist(); print("\n".join(names)); assert "CloneBins/CloneBins.exe" in names; assert "CloneBins/clonebins-api.exe" in names'

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: dist/release

      - name: List artifacts
        run: ls -lh dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: CloneBins ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: dist/release/*
          body_path: .github/release-notes-v0.1.1.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
