name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/core -e packages/cli pytest
      - name: CLI smoke
        run: |
          clonebins --help
          clonebins cluster --help
          clonebins version
      - name: Tests
        run: python -m pytest
