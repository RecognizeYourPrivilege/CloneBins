# Default path pulls the prebuilt image. No clone-time build.
#   docker compose pull
#   docker compose up
# Host folder $HOME/gens is mounted read-only at /data (type /data in the UI).
#
# Contributors, from source: uncomment `build: .`, then
#   docker compose up --build
services:
  clonebins:
    image: ghcr.io/recognizeyourprivilege/clonebins:latest
    # build: .
    ports:
      - "8765:8765"
    environment:
      CLONEBINS_API_HOST: "0.0.0.0"
      CLONEBINS_API_PORT: "8765"
      CLONEBINS_MODELS_DIR: /models
      CLONEBINS_WEB_DIST: /app/web/dist
    volumes:
      - ${HOME}/gens:/data:ro
