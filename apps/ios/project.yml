name: CloneBins
options:
  bundleIdPrefix: dev.clonebins
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
attributes:
  ORGANIZATIONNAME: CloneBins
targets:
  CloneBins:
    type: application
    platform: iOS
    sources:
      - path: CloneBins
        excludes:
          - Info.plist
    dependencies:
      - sdk: ImageIO.framework
      - sdk: PhotosUI.framework
      - sdk: UniformTypeIdentifiers.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.clonebins.ios
        PRODUCT_NAME: CloneBins
        INFOPLIST_FILE: CloneBins/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: false
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: CloneBins/Info.plist
schemes:
  CloneBins:
    build:
      targets:
        CloneBins: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
