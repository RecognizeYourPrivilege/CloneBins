[package]
name = "clonebins-desktop"
version = "0.1.4"
description = "Tauri 2 desktop shell for CloneBins"
authors = ["CloneBins contributors"]
edition = "2021"
rust-version = "1.85"
license = "MIT"

[lib]
name = "clonebins_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
